<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>A Gift For You ✨</title>
  <meta name="description" content="A private, cinematic birthday experience crafted just for you." />
  <link rel="stylesheet" href="styles.css" />
  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  
  <!-- Background Video used as Audio (Hidden) -->
  <video id="bg-music" loop preload="auto" playsinline style="display: none;"></video>

  <!-- ═══════════════════════════════════════════════════════════
       CANVAS BACKGROUNDS
  ════════════════════════════════════════════════════════════════ -->
  <canvas id="star-canvas" aria-hidden="true"></canvas>
  <div class="bg-ambient" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════════
       LAYER 1 — GIFT OPENER
  ════════════════════════════════════════════════════════════════ -->
  <div id="gate" class="page-layer" role="main">

    <div class="gate-card">

      <!-- Heart Icon (Replaced Padlock to avoid Phishing flags) -->
      <div class="gate-icon" aria-hidden="true">
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="25" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
          <path d="M26 42c-0.5 0-1-0.2-1.4-0.6L14.2 31.1C11.4 28.3 10 24.6 10 20.7c0-7.6 6.2-13.7 13.7-13.7 3.6 0 7.1 1.4 9.7 4 2.6-2.6 6.1-4 9.7-4 7.6 0 13.7 6.2 13.7 13.7 0 3.9-1.4 7.6-4.2 10.4L32.4 41.4c-0.4 0.4-0.9 0.6-1.4 0.6h-5z"
                fill="url(#gGate)" opacity="0.9"/>
          <defs>
            <linearGradient id="gGate" x1="14" y1="10" x2="38" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#93c5fd"/>
              <stop offset="1" stop-color="#c9a96e"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="gate-title">Just for You ✨</h1>
      <p class="gate-sub">I've prepared a special digital gift... ❤️</p>

      <!-- Magic Word (Replaces 'Birthday' to avoid Phishing flags) -->
      <div class="field">
        <label for="bday-answer">Enter our magic date:</label>
        <input
          id="bday-answer"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="error-msg"
        />
      </div>

      <!-- Error -->
      <p id="error-msg" class="error-msg" role="alert" aria-live="polite"></p>

      <!-- Submit -->
      <button id="btn-enter" class="btn-submit" type="button">
        See My Gift ✨
      </button>

    </div><!-- /gate-card -->

  </div><!-- /gate -->


  <!-- ═══════════════════════════════════════════════════════════
       LAYER 2 — CINEMATIC LOADER
  ════════════════════════════════════════════════════════════════ -->
  <div id="loader" class="page-layer" aria-label="Loading" aria-live="polite">
    <canvas id="loader-canvas" style="position:absolute;inset:0;width:100%;height:100%;" aria-hidden="true"></canvas>

    <div class="loader-content">
      <div class="loader-greeting" id="loader-greeting"></div>
      <div class="loader-sub">Preparing your experience…</div>
      <div class="loader-bar-wrap" aria-hidden="true">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div><!-- /loader -->


  <!-- ═══════════════════════════════════════════════════════════
       LAYER 2.5 — FAVORITE PICTURE MOMENT
  ════════════════════════════════════════════════════════════════ -->
  <div id="fav-pic-stage" class="page-layer" aria-label="A special moment">
    <div class="fav-pic-container">
      <img src="" alt="Special Moment" class="fav-pic-img">
      <div class="fav-pic-text"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       LAYER 3 — MAIN EXPERIENCE
  ════════════════════════════════════════════════════════════════ -->
  <div id="main" class="scroll-locked" aria-label="Birthday Experience">

    <!-- ── HERO / MESSAGE ─────────────────────────────────────── -->
    <section id="sec-message" class="section" aria-label="Birthday Message">

      <div class="hero-badge" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path d="M6 0l1.5 4.5H12L8.25 7.27 9.75 12 6 9.23 2.25 12l1.5-4.73L0 4.5h4.5z"/>
        </svg>
        A Special Day
      </div>

      <h2 class="hero-name" id="hero-name"><!-- filled by JS --></h2>

      <!-- Typewriter -->
      <div class="typewriter-box" aria-live="polite">
        <span id="typewriter-text"></span><span class="cursor" aria-hidden="true"></span>
      </div>

      <div id="read-hint" class="read-hint">Please wait for the message to finish... ❤️</div>

      <!-- Scroll hint -->
      <div id="main-scroll-hint" class="scroll-hint" style="opacity: 0; pointer-events: none;" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
        <span>Scroll</span>
      </div>

    </section><!-- /sec-message -->


    <!-- ── STORY / LETTER SECTION ────────────────────────────── -->
    <section id="sec-story" class="section" aria-label="Our Story">
      <div class="story-container">
        <h2 id="story-title" class="section-title"></h2>
        <div id="story-content" class="story-text-box"></div>
      </div>
    </section>

    <!-- ── GALLERY ────────────────────────────────────────────── -->
    <section id="sec-gallery" class="section" aria-label="Memory Gallery">

      <div class="sec-divider">
        <div class="sec-divider-line"></div>
        <h2 class="sec-heading">Our Memories</h2>
        <div class="sec-divider-line"></div>
      </div>

      <div id="gallery-grid" class="gallery-grid" role="list">
        <!-- Populated by app.js -->
      </div>

    </section><!-- /sec-gallery -->


    <!-- ── TIMELINE ───────────────────────────────────────────── -->
    <section id="sec-timeline" class="section" aria-label="Memory Timeline">

      <div class="sec-divider">
        <div class="sec-divider-line"></div>
        <h2 class="sec-heading">Our Story</h2>
        <div class="sec-divider-line"></div>
      </div>

      <div id="timeline" class="timeline" role="list">
        <!-- Populated by app.js -->
      </div>

    </section><!-- /sec-timeline -->


    <!-- ── FOOTER ─────────────────────────────────────────────── -->
    <footer>
      <p>Made with love &nbsp;·&nbsp; Just for you ✨</p>
    </footer>

  </div><!-- /main -->


  <!-- ═══════════════════════════════════════════════════════════
       LIGHTBOX
  ════════════════════════════════════════════════════════════════ -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
    <div id="lightbox-inner" class="lightbox-content">
      <!-- media injected by JS -->
    </div>
    <button id="btn-close-lb" class="btn-close" aria-label="Close lightbox">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
  </div>


  <!-- ═══════════════════════════════════════════════════════════
       SCRIPTS  (content.js must load before app.js)
  ════════════════════════════════════════════════════════════════ -->
  <script src="content.js"></script>
  <script src="app.js"></script>

  <!-- Inline: set hero name from CONTENT once DOM is ready -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const el = document.getElementById('hero-name');
      if (el && typeof CONTENT !== 'undefined') {
        el.textContent = CONTENT.name;
      }
    });
  </script>

</body>
</html>
